<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <main>
      <form class='box'>
        <h2>Add Recipe</h2>
        <section>
          <label for='name'>Name:</label>
          <input type='text' id='name' value='0'>
        </section>
        <section id='ingredient-form'>
        <label for='ingredients'>Ingredients: </label>
        <input type='text' id='ingredients' value='Enter an ingredient'>
        <button type='button'>Add ingredient</button>
        <ul id='ingredient-list'></ul>
        </section>
        <section>
          <label for='instructions'>Instructions: </label>
          <input type='text' id='instructions' value='Enter the instructions'>
          <button type='button'>Add ingredient</button>
          <ul id='instructions-list'></ul>
        </section>
        <section>
          <label for='cook-time'>Cook time: </label>
          <input type='number' id='instructions' value='0'>
        </section>
        <button id="submit">Submit Recipe</button>
      </form>
      <section class = 'box'>
        <h2 id = 'all-recipes'>All Recipes</h2>
      </section>
    </main>
  </body>
</html>
