<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <main>
      <form class='box' id='form'>
        <h2>Add Recipe</h2>
        <section>
          <label for='recipe-name'>Name:</label>
          <input type='text' id='recipe-name' value=''>
        </section>
        <section>
          <label for='ingredients'>Ingredients: </label>
          <input type='text' id='ingredients' value='Enter one ingredient'>
          <button type='button' class='add'>Add ingredient</button>
          <ul id='ingredients-list'></ul>
        </section>
        <section>
          <label for='instructions'>Instructions: </label>
          <input type='text' id='instructions' value='Enter a step'>
          <button type='button' class='add'>Add step</button>
          <ol id='instructions-list'></ol>
        </section>
        <section>
          <label for='cook-time'>Cook time: </label>
          <input type='number' id='cook-time' value='0'>
        </section>
        <button id="submit">Submit Recipe</button>
      </form>
      <section class='box' id='recipes'>
        <h2 id = 'all-recipes'>All Recipes</h2>
      </section>
    </main>
  </body>
</html>
